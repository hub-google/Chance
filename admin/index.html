<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chance｜營運後台</title><link rel="stylesheet" href="../assets/site.css"></head><body><header><div class="headbar"><span class="brand">CHANCE / OPERATIONS</span><a href="../">產品總覽</a></div><h1>客服與試用申請後台</h1><p class="lead">只有已授權管理者能查看使用者的客服回報與試用意願。此頁不能扣款或授權付費資格。</p></header><main><section class="panel" id="admin-signin"><h2>管理員登入</h2><p class="note">請使用在 Supabase Auth 登記且已加入 Chance 管理員名單的帳號。管理名單必須由擁有人在受保護的資料庫管理端設定。</p><div class="formgrid"><div class="field"><label for="adm-email">電子郵件</label><input type="email" id="adm-email" autocomplete="email"></div><div class="field"><label for="adm-pass">密碼</label><input type="password" id="adm-pass" autocomplete="current-password"></div></div><div class="tools"><button class="btn primary" id="adm-login">管理員登入</button><button class="btn" id="adm-reuse">使用目前 Chance 帳號</button></div></section><section id="admin-content" hidden><div class="panel"><div class="toolbar"><div><h2>營運狀態</h2><p id="adm-who" class="note"></p></div><div class="tools"><button class="btn" id="adm-refresh">重新整理</button><button class="btn" id="adm-logout">登出</button></div></div><div class="metrics"><article class="metric"><small>客服問題</small><div class="number" id="adm-count">0</div></article><article class="metric"><small>待處理</small><div class="number" id="adm-open">0</div></article><article class="metric"><small>試用意願</small><div class="number" id="adm-trials-count">0</div></article></div></div><div class="panel"><h2>客服問題與真人回覆</h2><div id="adm-tickets"></div></div><div class="panel"><h2>產品試用申請</h2><div id="adm-trials"></div></div></section><p id="adm-status" class="note" role="status"></p></main><script src="../assets/admin.js" defer></script></body></html>
